<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portail Élève</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Page d'accueil du portail élève, affichant les classes disponibles et les binômes associés -->
<main id="containerMain">
    <!-- En-tête de la page avec le titre du portail élève -->
    <header>
        <h1>Portail élève</h1>
    </header>

    <!-- Section d'affichage des classes disponibles, qui sera remplie dynamiquement par le script main.js -->
    <div id="typeClasse" style="display: none"></div>

    <!-- Section d'affichage des binômes associés à la classe sélectionnée -->
    <section id="buttons">
        <p>Chargement des élèves...</p>
    </section>


    <!-- Bouton de retour pour changer de classe, qui sera affiché une fois qu'une classe et un binôme auront été sélectionnés -->
    <div id="retourClasseBtn" style="display: none"></div>

    <!-- Pied de page avec information de connexion -->
    <footer>
        <p class="info">Connecté en tant qu'élève</p>
    </footer>
</main>

<script src="js/main.js" defer></script>
</body>
</html>
