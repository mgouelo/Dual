<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>Test VMA</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<!-- Page de test de VMA, accessible depuis la séance d'endurance -->
<div id="container">

    <!-- En-tête de la page avec le titre et les instructions pour le test de VMA -->
    <header>
        <h1>Test VMA de <span id="nom-eleve-vma">(Chargement...)</span></h1>
        <p>Lancer le chono au début de l'épreuve et l'arrêter dès que le camarade ne peut plus suivre le rythme imposé</p>
    </header>

    <!-- Affichage du chronomètre pour le test de VMA -->
    <div id="chrono">00:00:00</div>

    <!-- Section d'affichage des informations sur la vitesse, la distance parcourue et la VMA actuelle pendant le test -->
    <div id="infos" class="stats-dashboard">
        <div class="stat-card">
            <span class="stat-label">Vitesse</span>
            <div class="stat-data">
                <span id="vitesse" class="stat-value">8.0</span>
                <span class="stat-unit">km/h</span>
            </div>
        </div>

        <div class="stat-card">
            <span class="stat-label">Distance</span>
            <div class="stat-data">
                <span id="distance" class="stat-value">0</span>
                <span class="stat-unit">m</span>
            </div>
        </div>

        <div class="stat-card stat-highlight">
            <span class="stat-label">VMA actuelle</span>
            <div class="stat-data">
                <span id="vma-actuelle" class="stat-value">--</span>
                <span class="stat-unit">km/h</span>
            </div>
        </div>
    </div>

    <!-- Boutons de contrôle pour le chronomètre du test de VMA -->
    <div id="buttonTraining">
        <button id="reset" class="button">Reset</button>
        <button id="stop" class="button">Arrêter</button>
        <button id="start" class="button">Démarrer</button>
        <button id="resume" style="display: none;" class="button">Reprendre le test</button>
    </div>

    <!-- Section d'affichage des résultats du test de VMA et du parcours réalisé, avec des badges pour les parcours et les VMA obtenues -->
    <div id="resultat"></div>
    <div id="parcours"></div>

    <!-- Zone d'action pour enregistrer la VMA obtenue après le test, avec un bouton pour valider l'enregistrement de la VMA -->
    <div id="zone-actions-vma">
        <button id="btn-save-vma" class="button">
            Enregistrer la nouvelle VMA
        </button>
    </div>

    <!-- Boutons pour enregistrer les résultats du test de VMA et revenir à la page de séance -->
    <button id="retourSeance" class="button btn-back">Retour séance</button>

    <!-- Modal de confirmation pour les actions importantes, comme l'enregistrement de la VMA obtenue après le test -->
    <div id="custom-confirm" class="modal">
        <div class="modal-content">
            <h3>Confirmation</h3>
            <p id="confirm-message">Êtes-vous sûr ?</p>
            <div class="modal-buttons">
                <button id="confirm-ok" class="btn-confirm">OK</button>
                <button id="confirm-cancel" class="btn-cancel">Annuler</button>
            </div>
        </div>
    </div>

    <footer>
        <p class="info">Connecté au serveur local</p>
    </footer>
</div>

<script src="../js/vma.js" defer></script>
<script src="../js/syncVma.js" defer></script>
</body>
</html>
