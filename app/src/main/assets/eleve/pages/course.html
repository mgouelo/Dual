<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>Course</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <!-- Page d'entraînement à la course pour les séances de biathlon -->
    <div id="container">

        <!-- En-tête de la page -->
        <header>
            <h1>Entraînement à la course</h1>
            <p>Réaliser un tour de parcours et noter son temps</p>
        </header>

        <!-- Affichage du badge de parcours et du chrono -->
        <div id="vma-result-display" class="vma-card-display">
            <p class="vma-display-label">Mon Parcours</p>
            <div id="badge-parcours" class="parcours-badge">
                -
            </div>
        </div>

        <!-- Chronomètre pour le temps de parcours -->
        <div id="chrono">00:00:00</div>

        <!-- Boutons de contrôle du chronomètre -->
        <div id="buttonTraining">
            <button id="reset" class="button">Reset</button>
            <button id="stop" class="button">Arrêter</button>
            <button id="start" class="button">Démarrer</button>
        </div>

        <!-- Liste des tours réalisés -->
        <div id="listeTours"></div>

        <!-- Modal pour saisir le temps du tour et les résultats du tir -->
        <div class="action-bar">
            <button id="enregistrer" class="button">Enregistrer (+1 tour)</button>
            <button id="supprimer" class="button">Supprimer (-1 tour)</button>
        </div>

        <!-- Modal de confirmation pour les actions importantes -->
        <div id="custom-confirm" class="modal">
            <div class="modal-content">
                <h3>Confirmation</h3>
                <p id="confirm-message">Êtes-vous sûr ?</p>
                <div class="modal-buttons">
                    <button id="confirm-ok" class="btn-confirm">OK</button>
                    <button id="confirm-cancel" class="btn-cancel">Annuler</button>
                </div>
            </div>
        </div>

        <!-- Boutons pour enregistrer la session et revenir à la page de séance -->
        <button id="btn-envoyer" class="button" style="margin-top: 20px; background-color: #27ae60;">Enregistrer la session</button>
        <button id="retourSeance" class="button btn-back">Retour séance</button>

        <!-- Pied de page avec information de connexion -->
        <footer>
            <p class="info">Connecté au serveur local</p>
        </footer>
    </div>

<script src="../js/course.js" defer></script>
<script src="../js/syncVma.js" defer></script>
</body>
</html>
