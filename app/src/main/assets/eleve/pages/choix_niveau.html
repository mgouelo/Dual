<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>Sélection du Niveau</title>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<!-- Page de sélection du niveau pour les séances de biathlon -->
<div id="container">
    <!-- En-tête de la page -->
    <header>
        <h1>Session Biathlon</h1>
        <p>Sélectionnez le format de la séance</p>
    </header>

    <!-- Section de sélection des niveaux -->
    <div class="mode-group">
        <div class="mode-title">Cycle Initiation (6ème)</div>
        <button id="niveau-6eme" class="button">Séance 6eme</button>
        <p class="info" style="margin-top:10px; font-size:0.8rem;">Informations : Endurance (20 min) et Précision cumulée.</p>
    </div>

    <!-- Sélection pour le cycle compétition -->
    <div class="mode-group">
        <div class="mode-title">Cycle Compétition (4ème)</div>
        <button id="niveau-4eme" class="button">Séance 4eme</button>
        <p class="info" style="margin-top:10px; font-size:0.8rem;">Informations : Sprint, Chrono de tir et Pénalités.</p>
    </div>

    <!-- Bouton de retour pour changer de classe -->
    <button class="button btn-back" onclick="location.href='../index.html'">Changer de classe</button>
</div>

<script src="../js/choix_niveau.js" defer></script>
</body>
</html>
