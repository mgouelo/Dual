<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entraînement Tir</title>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<!-- Page d'entraînement pour le tir, accessible depuis la séance de biathlon -->
<div id="container">

    <!-- En-tête de la page avec le titre et la description de l'activité -->
    <header>
        <h1>Tir</h1>
        <p>Réalise tes séries et enregistre ton score</p>
    </header>

    <!-- Section d'affichage des séries de tir réalisées et des résultats obtenus -->
    <div id="tirs"></div>

    <!-- Barre d'action pour ajouter ou supprimer des séries de tir -->
    <div class="action-bar">
        <button id="ajouter-tir" class="button">Ajouter série</button>
        <button id="supprimer-tir" class="button">Supprimer série</button>
    </div>

    <!-- Section de saisie pour enregistrer les résultats de chaque série de tir -->
    <div id="resultats" style="display: none; margin-top: 20px;">
        <p style="font-size: 1.6rem;">
            Total réussites : <span id="total" style="font-weight: bold;">-</span>
        </p>
        <div id="medaille-display" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

    <!-- Boutons pour enregistrer les résultats et revenir à la page de séance -->
    <button id="btn-envoyer" class="button" style="background-color: #27ae60;">Envoyer les résultats</button>
    <button class="button btn-back" onclick="location.href='seance.html'">Retour séance</button>

    <footer>
        <p class="info">Connecté au serveur local</p>
    </footer>
</div>

<script src="../js/tir6eme.js" defer></script>
</body>
</html>
