<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Séance Biathlon</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<!-- Page principale de la séance de biathlon, avec accès aux différentes sections d'entraînement et d'évaluation -->
<div id="container">

    <!-- En-tête de la page avec le titre et les informations sur la séance -->
    <header>
        <h1 id="titre-session">Session Biathlon</h1>
        <p id="info-classe">Préparation de l'épreuve</p>
    </header>

    <!-- Carte de profil affichant le coureur actif et permettant d'inverser les rôles entre les binômes -->
    <div id="active-profile-card" class="profile-card">
        <div class="profile-content">
            <div class="profile-text">
                <p class="role-label">Coureur Actif</p>
                <div class="name-info">
                    <strong id="current-name">Chargement...</strong>
                    <span id="current-gender">(-)</span>
                </div>
            </div>
            <button class="button btn-switch" onclick="inverserRoles()">
                <i class="fa-solid fa-arrows-rotate"></i> Inverser
            </button>
        </div>
    </div>

    <!-- Sections principales de la séance, regroupant les différentes activités d'entraînement et d'évaluation -->
    <div class="hub-sections" id="hub-sections"></div>
    
    <!-- Un bouton pour changer de niveau et revenir à la page de sélection du niveau -->
    <button class="button btn-back">Changer de niveau</button>

    <!-- Modal de confirmation pour les actions importantes, avec un message dynamique et des boutons de validation et d'annulation -->
    <div id="custom-confirm" class="modal">
        <div class="modal-content">
            <h3>Confirmation</h3>
            <p id="confirm-message">Êtes-vous sûr ?</p>
            <div class="modal-buttons">
                <button id="confirm-ok" class="btn-confirm">OK</button>
                <button id="confirm-cancel" class="btn-cancel">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Pied de page avec information de connexion -->
    <footer>
        <p class="info">Connecté au en tant que élève</p>
    </footer>
</div>

<script src="../js/seance.js" defer></script>
</body>
</html>
